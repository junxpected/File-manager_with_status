name: .NET Desktop CI/CD

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore solution
        run: dotnet restore "File-manager_with_status.sln"

      - name: Build solution
        run: dotnet build "File-manager_with_status.sln" --configuration ${{ matrix.configuration }} --no-restore

      - name: Run tests
        run: dotnet test "FIle_manager.Tests/File-manager.Tests.csproj" --configuration ${{ matrix.configuration }} --no-build --verbosity minimal

      - name: Publish artifacts (Release only)
        if: matrix.configuration == 'Release'
        run: dotnet publish "File-manager/File-manager.csproj" --configuration Release --framework net10.0-windows --output "artifacts/publish" /p:UseWPF=true

      - name: Upload artifact
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: File-manager-publish
          path: artifacts/publish

  release:
    needs: build
    runs-on: windows-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download published artifact
        uses: actions/download-artifact@v4
        with:
          name: File-manager-publish
          path: release-artifact

      - name: Package release artifact
        run: |
          powershell -Command "Compress-Archive -Path 'release-artifact/**' -DestinationPath 'release-artifact.zip' -Force"

      - name: Create GitHub Release (using actions/create-release)
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: v${{ github.run_number }}
          release_name: "File-manager Release ${{ github.run_number }}"
          body: "Automated release from workflow run ${{ github.run_id }}"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload released asset
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: release-artifact.zip
          asset_name: File-manager-publish.zip
          asset_content_type: application/zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
