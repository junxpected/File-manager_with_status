name: .NET Desktop CI/CD

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore solution
        run: dotnet restore "File-manager_with_status.sln"

      - name: Build solution
        run: dotnet build "File-manager_with_status.sln" --configuration ${{ matrix.configuration }} --no-restore

      - name: Run tests
        run: dotnet test "FIle_manager.Tests/File-manager.Tests.csproj" --configuration ${{ matrix.configuration }} --no-build --verbosity minimal

      - name: Publish artifacts (Release only)
        if: matrix.configuration == 'Release'
        run: dotnet publish "File-manager/File-manager.csproj" --configuration Release --framework net10.0-windows --output "artifacts/publish" /p:UseWPF=true

      - name: Upload artifact
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: File-manager-publish
          path: artifacts/publish

  release:
    needs: build
    runs-on: windows-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download published artifact
        uses: actions/download-artifact@v4
        with:
          name: File-manager-publish
          path: release-artifact

      - name: Create GitHub Release
        id: create_release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ github.run_number }}
          name: "File-manager Release ${{ github.run_number }}"
          body: "Automated release from workflow run ${{ github.run_id }}"
          draft: false
          prerelease: false

      - name: Upload release assets
        uses: softprops/action-gh-release@v1
        with:
          files: release-artifact/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
